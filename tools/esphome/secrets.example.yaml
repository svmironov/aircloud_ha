# This is a format example. The recommended setup command creates secrets.yaml:
#   scripts/configure_local_firmware.sh
# Never commit the generated file.

# Identification only. The model does not select a different firmware profile.
device_name: "hitachi-rak-example"
friendly_name: "Hitachi RAK-EXAMPLE"

# Home Wi-Fi embedded in the firmware.
wifi_ssid: "YOUR_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Generated automatically by the setup script.
fallback_ap_ssid: "Hitachi RAK-EXAMPLE Setup"
fallback_ap_password: "replace-with-at-least-12-characters"
api_encryption_key: "replace-with-a-32-byte-base64-key"
ota_password: "replace-with-a-strong-unique-password"
